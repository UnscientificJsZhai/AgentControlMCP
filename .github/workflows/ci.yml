name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    name: Build Windows process host
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
      - name: Compile x64 and ARM64 with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ACM_VS_ROOT=%%i"
          call "%ACM_VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64
          node scripts/build-windows-host.mjs x64
          if errorlevel 1 exit /b 1
          call "%ACM_VS_ROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          node scripts/build-windows-host.mjs arm64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-process-host
          path: |
            native/win32-x64/process-host.exe
            native/win32-arm64/process-host.exe
          if-no-files-found: error
          # 保留重跑和本地复现所需的产物，覆盖 GitHub 的 30 天重跑窗口后自动清理。
          retention-days: 30
  check:
    needs: windows-host
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.x']
        include:
          - os: ubuntu-latest
            node: '24.13.0'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Set up host Python for offline installation fixtures
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned uv for persistent environment tests
        run: python -m pip install uv==0.12.17
      - name: Download compiled Windows process host
        uses: actions/download-artifact@v8
        with:
          name: windows-process-host
          path: native
      - name: Run project checks
        run: npm run check
      - name: Check npm package contents
        run: npm pack --dry-run
