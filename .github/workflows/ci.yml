name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.x']
        include:
          - os: ubuntu-latest
            node: '24.13.0'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js 和 npm 缓存
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 运行工程检查
        run: npm run check
